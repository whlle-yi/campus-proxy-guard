name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .[dev]
      - name: Build exe
        run: >
          pyinstaller --noconsole --onefile --clean
          --name CampusProxyGuard
          --icon icon.ico
          launcher.py
      - name: Package zip
        run: |
          Copy-Item README.md dist\
          Compress-Archive -Path dist\CampusProxyGuard.exe, dist\README.md `
            -DestinationPath CampusProxyGuard-${{ github.ref_name }}-win64.zip -Force
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CampusProxyGuard-*.zip
          generate_release_notes: true
